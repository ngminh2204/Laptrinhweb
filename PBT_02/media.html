<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Giới thiệu sản phẩm</title>
</head>
<body>

<svg width="80" height="80">
  <rect width="80" height="80" rx="12" fill="#F5F5F5"/>
  <circle cx="40" cy="40" r="20" fill="#000"/>
  <text x="40" y="45" text-anchor="middle" fill="white" font-size="10">
    Apple
  </text>
</svg>

<h1>iPhone 16 Pro Max</h1>
<figure>
  <img src="http://placehold.co/200x200" alt="Mặt trước iPhone 16 Pro Max" loading="lazy"
       style="max-width:100%; height:auto;">
  <figcaption>Mặt trước iPhone 16 Pro Max</figcaption>
</figure>

<figure>
  <img src="http://placehold.co/200x200" alt="Mặt sau iPhone 16 Pro Max" loading="lazy"
       style="max-width:100%; height:auto;">
  <figcaption>Mặt sau iPhone 16 Pro Max</figcaption>
</figure>

<figure>
  <img src="http://placehold.co/200x200" alt="Camera iPhone 16 Pro Max" loading="lazy"
       style="max-width:100%; height:auto;">
  <figcaption>Hệ thống camera chuyên nghiệp</figcaption>
</figure>

<hr>
<h2>Video giới thiệu</h2>
<iframe width="560" height="315" src="https://www.youtube.com/embed/70gCxCTpvBg?si=oMVYS3epWIjmA8bU" title="Video giới thiệu sản phẩm" allowfullscreen>
</iframe>

<hr>

<h2>Video sản phẩm</h2>
<video controls poster="poster.jpg" width="560">
  <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
  <source src="https://www.w3schools.com/html/mov_bbb.webm" type="video/webm">
  Trình duyệt không hỗ trợ video.
</video>

<hr>

<h2>Nhạc nền</h2>
<audio controls>
  <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
  <source src="https://www.w3schools.com/html/horse.ogg" type="audio/ogg">
    Trình duyệt không hỗ trợ audio.
</audio>

</body>
</html>
